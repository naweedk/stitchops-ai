version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stitchops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stitchops
      POSTGRES_PASSWORD: stitchops_secret
      POSTGRES_DB: stitchops_db
    ports:
      # Port 5433 on the host maps to 5432 in the container
      # This prevents collision with any existing local PostgreSQL on 5432
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stitchops -d stitchops_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
